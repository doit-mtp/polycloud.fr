name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'cloudflare-worker'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Migrate the database and deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/worker
          # Migrations run first, so the new code never runs against an old schema.
          # The action stops at the first failing command: a failed migration skips the deploy.
          command: |
            d1 migrations apply DB --remote
            deploy
