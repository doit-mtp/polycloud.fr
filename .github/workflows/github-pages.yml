name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Daily rebuild: the site's wording follows the event date (before / on the day / after),
  # which is computed at build time. 00:07 UTC = 01:07 Paris (CET) / 02:07 (CEST).
  # Off-the-hour minute to reduce GitHub's scheduled-run queueing delay.
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          path: apps/site
          # Since it's in a sub-directory the action doesn't see the pnpm-lockfile and is unable to
          # figure out we're using pnpm so we explicitly define the package manager to use.
          package-manager: pnpm@12.21.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
